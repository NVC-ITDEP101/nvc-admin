<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
         * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #1f1f1f, #0a6a7c, #000000); 
            background-attachment: fixed;
            color: white; 
            height: 100vh;
            overflow: hidden;
        }

        .main-layout { display: flex; height: 100vh; }

        /* Sidebar Navigation */
        nav { 
            width: 20%; 
            background-color: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(15px);
            height: 100%; 
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo { text-align: center; padding: 40px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo h1 { font-size: 1.5rem; letter-spacing: 2px; color: #00d4ff; }

        nav a { 
            display: block; 
            text-decoration: none; 
            padding: 20px 30px; 
            color: rgba(255, 255, 255, 0.7); 
            transition: 0.3s; 
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }
        
        nav a:hover, .active { 
            background-color: rgba(0, 212, 255, 0.1); 
            color: #00d4ff;
            border-left: 3px solid #00d4ff;
        }
        /* Content Area (80%) */
        .content-area {
            flex-grow: 1;
            width: 80%;
            padding: 40px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
         h2, h1 { margin-top: 0; font-weight: 300; }

        .add-btn {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            
            font-size: 20px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #0077b6;
            transform: scale(1.05);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .gallery-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        .gallery-box:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .img-container {
            width: 100%;
            height: 180px;
            background-color: #222;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box-details {
            padding: 15px;
        }

        .box-actions {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .edit-btn { color: #48cae4; }
        .delete-btn { color: #ff4d4d; }
        .action-btn:hover { transform: scale(1.2); }

        /* Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-form {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            width: 450px;
            border: 1px solid #006979;
        }

        .modal-form h2 { margin-top: 0; color: #48cae4; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }

        .form-btns { display: flex; gap: 15px; margin-top: 25px; }
        .save-btn { flex: 1; background: #00b4d8; border: none; padding: 12px; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cancel-btn { flex: 1; background: #444; border: none; padding: 12px; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-layout">
        <nav>
           <div class="logo"><h1>NVC Admin</h1></div>
            <a href="index.html">News and Updates</a>
            <a href="members.html" >Members</a>
            <a href="gallery.html">Gallery</a> 
            <a href="download.html">Attendance</a> 
            <a href="event.html">Events</a>
        </nav>

        <div class="content-area">
            <div class="top-bar">
                <h2>Gallery Management</h2>
                <button class="add-btn" onclick="openModal()">
                    <i class="fas fa-plus"></i> Add Image to Gallery
                </button>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                
                

            </div>
        </div>
    </div>

    <div class="modal" id="imageModal">
        <div class="modal-form">
            <h2 id="formTitle">Insert New Image</h2>
            <div class="form-group">
                <label>Select Image File</label>
                <input type="file" id="imgFile">
            </div>
            
            <div class="form-btns">
                <button class="save-btn" onclick="saveImage()">Upload & Save</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
       // 1. Initialize Supabase correctly
// Note: Changed the variable name slightly to avoid conflict with the library itself
const { createClient } = supabase;
const _supabase = createClient('https://lgbgobzasuqozdkvxifk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYmdvYnphc3Vxb3pka3Z4aWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0ODg3OTcsImV4cCI6MjA4NDA2NDc5N30.a64sYwLUfGd1qNqg9Vfon_DqvrntkMiB1v-l6tPoITM');

const modal = document.getElementById('imageModal');

// 2. UI Functions
function openModal() {
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
}

// Close modal when clicking outside of the box
window.onclick = function(event) {
    if (event.target == modal) {
        closeModal();
    }
}

// 3. Logic: Fetch and Display Images in Admin Panel
async function loadAdminGallery() {
    const { data, error } = await _supabase
        .from('gallery_items')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) return console.error(error);

    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = ''; // Clear existing static content

    data.forEach(item => {
        const box = document.createElement('div');
        box.className = 'gallery-box';
        box.innerHTML = `
            <div class="img-container">
                <img src="${item.image_url}" alt="Gallery Image">
            </div>
            <div class="box-details">
                <p style="font-size: 12px; color: #aaa; margin: 5px 0;">Added on: ${new Date(item.created_at).toLocaleDateString()}</p>
            </div>
            <div class="box-actions">
                <button class="action-btn delete-btn" onclick="deleteImage('${item.id}', '${item.image_path}')">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        grid.appendChild(box);
    });
}

// 4. Logic: Upload Image
async function saveImage() {
    const fileInput = document.getElementById('imgFile');
    const file = fileInput.files[0];
    const uploadBtn = document.querySelector('.save-btn');

    if (!file) return alert("Select an image first!");

    // Disable button during upload
    uploadBtn.innerText = "Uploading...";
    uploadBtn.disabled = true;

    try {
        const fileName = `${Date.now()}-${file.name}`;

        // Upload to Storage
        const { data: uploadData, error: uploadError } = await _supabase.storage
            .from('gallery')
            .upload(fileName, file);

        if (uploadError) throw uploadError;

        // Get URL
        const { data: urlData } = _supabase.storage
            .from('gallery')
            .getPublicUrl(fileName);

        const publicUrl = urlData.publicUrl;

        // Save to Table
        const { error: dbError } = await _supabase
            .from('gallery_items')
            .insert([{ image_path: fileName, image_url: publicUrl }]);

        if (dbError) throw dbError;

        alert("Image added successfully!");
        location.reload();
    } catch (err) {
        alert("Error: " + err.message);
        uploadBtn.innerText = "Upload & Save";
        uploadBtn.disabled = false;
    }
}

// 5. Logic: Delete Image
async function deleteImage(id, filePath) {
    if(!confirm("Are you sure you want to delete this image?")) return;

    try {
        // Remove from Storage
        const { error: storageError } = await _supabase.storage.from('gallery').remove([filePath]);
        if (storageError) throw storageError;

        // Remove from Database
        const { error: dbError } = await _supabase.from('gallery_items').delete().eq('id', id);
        if (dbError) throw dbError;

        location.reload();
    } catch (err) {
        alert("Delete failed: " + err.message);
    }
}

// Load the gallery on page start
window.onload = loadAdminGallery;
    </script>
</body>
</html>
