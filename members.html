<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Members</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      body { 
            margin: 0; 
            background: linear-gradient(135deg, #1f1f1f, #0a6a7c, #000000); 
            background-attachment: fixed;
            color: white; 
            height: 100vh;
            overflow: hidden;
        }

        .main-layout { display: flex; height: 100vh; }

        /* Sidebar Navigation */
        nav { 
            width: 20%; 
            background-color: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(15px);
            height: 100%; 
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo { text-align: center; padding: 40px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo h1 { font-size: 1.5rem; letter-spacing: 2px; color: #00d4ff; }

        nav a { 
            display: block; 
            text-decoration: none; 
            padding: 20px 30px; 
            color: rgba(255, 255, 255, 0.7); 
            transition: 0.3s; 
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }
        
        nav a:hover, .active { 
            background-color: rgba(0, 212, 255, 0.1); 
            color: #00d4ff;
            border-left: 3px solid #00d4ff;
        }

        /* Content Area */
        .content-area { width: 80%; padding: 40px; overflow-y: auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
       .add-btn {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            
            font-size: 20px;
            transition: 0.3s;
        }
         h2, h1 { margin-top: 0; font-weight: 300; }

        /* Member Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .member-card { background: rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .member-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.2); }
        
        .member-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: #333; }
        .controls { margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
        .btn-edit { color: #00d1ff; cursor: pointer; background: none; border: none; }
        .btn-delete { color: #ff4d4d; cursor: pointer; background: none; border: none; }

        /* Simple Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-box {  background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            width: 450px;
            border: 1px solid #006979; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; }
        .btn-delete{
            color: black;
        }
        .btn-edit{
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <nav>
            <div class="logo"><h1>NVC ADMIN</h1></div>
            <a href="index.html">News and Updates</a>
            <a href="members.html" >Members</a>
            <a href="gallery.html">Gallery</a> 
            <a href="download.html">Attendance</a> 
            <a href="event.html">Events</a>
        </nav>
        
        <div class="content-area">
            <div class="header-flex">
                <h2>Manage Members</h2>
                <button class="add-btn" onclick="openModal()">+ Add Member</button>
            </div>

            <div class="gallery-grid">
               
            </div>
        </div>
    </div>

   

<div id="modal">
    <div class="modal-box">
        <h3>Member Details</h3>
        <input type="hidden" id="memberId">
        <input type="text" id="memberName" placeholder="Full Name">
        
        <select id="memberPosition">
            <option value="">Select Position</option>
            <option value="President">President</option>
            <option value="Vice President">Vice President</option>
            <option value="Secretary">Secretary</option>
            <option value="Assistant Secretary">Assistant Secretary</option>
            <option value="Treasurer">Treasurer</option>
            <option value="Assistant Treasurer">Assistant Treasurer</option>
            <option value="Head of Coordination">Head of Coordination</option>
            <option value="Editor">Editor</option>
            <option value="Assistant Editor">Assistant Editor</option>
            <option value="Faculty Coordinator(FOB)">Faculty Coordinator(FOB)</option>
            <option value="Faculty Coordinator(FOC)">Faculty Coordinator(FOC)</option>
            <option value="Faculty Coordinator(FOE)">Faculty Coordinator(FOE)</option>
            <option value="Faculty Coordinator(FOS)">Faculty Coordinator(FOS)</option>
            <option value="Faculty Coordinator(FOS & FOE)">Faculty Coordinator(FOS & FOE)</option>
            <option value="Executive Member">Executive Member</option>
        </select>

        <label>Upload Photo</label>
        <input type="file" id="memberFile" accept="image/*">
        
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="add-btn" style="flex:1" onclick="saveMember()">Upload</button>
            <button class="add-btn" style="flex:1; background:#444" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUB_URL = "https://lgbgobzasuqozdkvxifk.supabase.co";
    const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYmdvYnphc3Vxb3pka3Z4aWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0ODg3OTcsImV4cCI6MjA4NDA2NDc5N30.a64sYwLUfGd1qNqg9Vfon_DqvrntkMiB1v-l6tPoITM";
    const _supabase = supabase.createClient(SUB_URL, SUB_KEY);

    // Load members when the page opens
    document.addEventListener('DOMContentLoaded', fetchMembers);

    async function fetchMembers() {
        // We order by 'id' to ensure consistency if 'created_at' isn't in your table
        const { data, error } = await _supabase
            .from('members')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('Error fetching data:', error);
            return;
        }
        
        const grid = document.querySelector('.gallery-grid');
        grid.innerHTML = ''; // Clear previous content

        data.forEach(m => {
            // Check if image_url exists, otherwise use a placeholder
            const imageUrl = m.image_url ? m.image_url : 'https://via.placeholder.com/200x200?text=No+Image';

            grid.innerHTML += `
                <div class="member-card">
                    <img src="${imageUrl}" class="member-img" alt="${m.name}" onerror="this.src='https://via.placeholder.com/200x200?text=Error+Loading'">
                    <h4>${m.name}</h4>
                    <p style="color: #ccc; font-size: 0.8rem;">${m.position}</p>
                    <div class="controls">
                        <button class="btn-edit" onclick="editMember('${m.id}', '${m.name.replace(/'/g, "\\'")}', '${m.position}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn-delete" onclick="deleteMember('${m.id}', '${m.image_path}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>`;
        });
    }

    // Modal Controls
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('memberId').value = '';
        document.getElementById('memberName').value = '';
        document.getElementById('memberPosition').value = '';
        document.getElementById('memberFile').value = '';
    }

    // Edit Function
    function editMember(id, name, pos) {
        document.getElementById('memberId').value = id;
        document.getElementById('memberName').value = name;
        document.getElementById('memberPosition').value = pos;
        openModal();
    }
    async function saveMember() {
    const id = document.getElementById('memberId').value;
    const name = document.getElementById('memberName').value;
    const position = document.getElementById('memberPosition').value; 
    const fileInput = document.getElementById('memberFile');
    const file = fileInput.files[0];

    // Validate that required fields are filled
    if (!name || !position) {
        alert("Please fill in the name and select a position.");
        return;
    }

    let imageUrl = "";
    let imagePath = "";

    // Step 1: Handle Image Upload to the Bucket
    if (file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`; // Unique name to avoid overwriting
        
        const { data, error: uploadError } = await _supabase.storage
            .from('member-images') // Ensure this matches your bucket name
            .upload(fileName, file);
        
        if (uploadError) {
            alert("Error uploading image: " + uploadError.message); 
            return;
        }
        
        // Retrieve the public URL for the newly uploaded image
        imagePath = data.path;
        imageUrl = _supabase.storage.from('member-images').getPublicUrl(imagePath).data.publicUrl;
    }

    // Step 2: Save Details to the Database
    const memberData = { name, position };
    if (imageUrl) {
        memberData.image_url = imageUrl;
        memberData.image_path = imagePath;
    }

    let result;
    if (id) {
        // Update existing member if an ID is present
        result = await _supabase.from('members').update(memberData).eq('id', id);
    } else {
        // Insert new member if no ID is present
        result = await _supabase.from('members').insert([memberData]);
    }

    if (result.error) {
        alert("Database Error: " + result.error.message);
    } else {
        alert("Details are uploaded successfully!"); // Message as requested
        closeModal();
        fetchMembers(); // Refresh the display immediately
    }
}

    async function deleteMember(id, imagePath) {
        if (!confirm("Are you sure you want to delete this member?")) return;

        // Step 1: Delete the image from the bucket if it exists
        if (imagePath) {
            const { error: deleteError } = await _supabase.storage
                .from('member-images')
                .remove([imagePath]);
            
            if (deleteError) {
                alert("Error deleting image: " + deleteError.message);
                return;
            }
        }

        // Step 2: Delete the member record from the database
        const { error } = await _supabase.from('members').delete().eq('id', id);
        
        if (error) {
            alert("Error deleting member: " + error.message);
        } else {
            alert("Member deleted successfully!");
            fetchMembers(); // Refresh the display immediately
        }
    }
</script>

</body>

</html>
