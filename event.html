<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
         * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #1f1f1f, #0a6a7c, #000000); 
            background-attachment: fixed;
            color: white; 
            height: 100vh;
            overflow: hidden;
        }

        .main-layout { display: flex; height: 100vh; }

        /* Sidebar Navigation */
        nav { 
            width: 20%; 
            background-color: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(15px);
            height: 100%; 
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo { text-align: center; padding: 40px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo h1 { font-size: 1.5rem; letter-spacing: 2px; color: #00d4ff; }

        nav a { 
            display: block; 
            text-decoration: none; 
            padding: 20px 30px; 
            color: rgba(255, 255, 255, 0.7); 
            transition: 0.3s; 
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }
        
        nav a:hover, .active { 
            background-color: rgba(0, 212, 255, 0.1); 
            color: #00d4ff;
            border-left: 3px solid #00d4ff;
        }
        /* Content Area (80%) */
        .content-area {
            flex-grow: 1;
            width: 80%;
            padding: 40px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
         h2, h1 { margin-top: 0; font-weight: 300; }

        .add-btn {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            
            font-size: 20px;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #0077b6;
            transform: scale(1.05);
        }

        /*event content */
       .gls-section {
            display: table-row;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
           
            height: auto;
           
            height: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 0 auto;
            gap: 10px;
        }
        
        












        
        /* Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-form {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            width: 450px;
            border: 1px solid #006979;
        }

        .modal-form h2 { margin-top: 0; color: #48cae4; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }

        .form-btns { display: flex; gap: 15px; margin-top: 25px; }
        .save-btn { flex: 1; background: #00b4d8; border: none; padding: 12px; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cancel-btn { flex: 1; background: #444; border: none; padding: 12px; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-layout">
        <nav>
           <div class="logo"><h1>NVC Admin</h1></div>
            <a href="index.html">News and Updates</a>
            <a href="members.html" >Members</a>
            <a href="gallery.html">Gallery</a> 
            <a href="download.html">Attendance</a> 
            <a href="event.html">Events</a>
        </nav>

        <div class="content-area">
            <div class="top-bar">
                <h2>Manage Events</h2>
                <button class="add-btn" onclick="openModal()">
                    <i class="fas fa-plus"></i> Add New Event
                </button>
            </div>
            <!-- glass content-->
           <div  class="gls-section">
            

           </div>
        </div>
    </div>

   <div class="modal" id="imageModal">
    <div class="modal-form">
        <h2 id="formTitle">Add New Event</h2>
        
        <div class="form-group">
            <label for="eventTitle">Event Name / Title</label>
            <input type="text" id="eventTitle" placeholder="e.g. Beach Cleanup 2026" required>
        </div>
       
        <div class="form-group">
            <label for="eventDate">Date of Event</label>
            <input type="date" id="eventDate" required>
        </div>

        <div class="form-btns">
            <button class="save-btn" onclick="saveImage()">
                <i class="fas fa-check"></i> Upload & Save
            </button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

    <script>
      
// --- Supabase Configuration ---
const SUPABASE_URL = 'https://lgbgobzasuqozdkvxifk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYmdvYnphc3Vxb3pka3Z4aWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0ODg3OTcsImV4cCI6MjA4NDA2NDc5N30.a64sYwLUfGd1qNqg9Vfon_DqvrntkMiB1v-l6tPoITM';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const eventList = document.querySelector('.gls-section');
const modal = document.getElementById('imageModal'); // Required to open form

// --- 1. Modal Control Functions (FIXED) ---
function openModal() {
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
    // Clear inputs
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventDate').value = '';
}

// Close if clicked outside
window.onclick = function(event) {
    if (event.target == modal) closeModal();
}

// --- 2. Save Function ---
async function saveImage() {
    const name = document.getElementById('eventTitle').value;
    const date = document.getElementById('eventDate').value;

    if (!name || !date) return alert("Please fill all fields");

    const { error } = await _supabase
        .from('events')
        .insert([{ event_name: name, event_date: date }]);

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Event Added!");
        closeModal();
        fetchEventsAdmin();
    }
}

// --- 3. Fetch Function ---
async function fetchEventsAdmin() {
    const { data, error } = await _supabase
        .from('events')
        .select('*')
        .order('event_date', { ascending: true });

    if (error) {
        console.error("Error fetching data:", error);
        return;
    }

    eventList.innerHTML = ''; 
    if (data) {
        data.forEach(event => {
            const dateObj = new Date(event.event_date);
            const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
            
            const eventDiv = document.createElement('div');
            eventDiv.style.cssText = `padding: 15px 100px; border-bottom: 3px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between;  width: 100%;`;
            eventDiv.innerHTML = `
                <div>
                    <h1 style="  margin:0;  font-size: 30px; color: #1a1a1a; font-style: italic; font-weight: bold;">${formattedDate}</h1>
                    <h2 style=" font-size: 20px; color: #ffffff; font-style: italic;">${event.event_name}</h2>
                </div>
                <button onclick="deleteEvent('${event.id}')" style="background: none; border: none;  color: rgb(0, 0, 0); cursor: pointer; font-size: 20px;">
                    <i class="fas fa-trash"></i>
                </button>`;
            eventList.appendChild(eventDiv);
        });
    }
}

// --- 4. Delete Function ---
async function deleteEvent(eventId) {
    if (confirm("Delete this event?")) {
        const { error } = await _supabase.from('events').delete().eq('id', eventId);
        if (error) alert(error.message);
        else fetchEventsAdmin();
    }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', fetchEventsAdmin);
    </script>
</body>
</html>
