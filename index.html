<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVC Admin Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, rgb(0, 56, 88) 0% , #013f48 20%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(0, 212, 255, 0.1);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.6); opacity: 0.3; }
            to { transform: scale(1.5); opacity: 0.6; }
        }

        .login-card {
            width: 400px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-card img {
            width: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
        }

        h2 {
            margin: 0 0 10px 0;
            font-weight: 300;
            letter-spacing: 3px;
            color: #00d4ff;
            text-transform: uppercase;
        }
        #logimg {
            width: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.7));
        }

        p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d4ff;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.75rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: #00d4ff;
        }

        #welcomeOverlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            justify-content: center; 
            align-items: center; 
           
            z-index: 9999; 
            opacity: 0; 
            transition: opacity 1.5s ease;
        }

         #welcomeOverlay h1 {
            color: #ffffff; 
            font-family: 'times new roman', serif; 
            letter-spacing: 5px;
            font-style: italic;
            text-shadow: 0 0 20px #00d4ff; 
            font-size: 2.5rem; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <audio id="bgMusic" loop>
        <source src="openmindaudio-emotional-intro-soft-cinematic-opening-464795.mp3" type="audio/mpeg">
    </audio>

    <div class="login-card">
        <img id="logimg" src="NVClogo.png" alt="Logo">
        <h2>System Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="User ID" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">LOGIN</button>
        </form>
    </div>

    <div id="welcomeOverlay">
        <h1 >
            WELCOME TO NVC ADMIN SYSTEM
        </h1>
    </div>
    




    <script>
       



    const music = document.getElementById('bgMusic');
        music.volume = 0.4; 

        function playMusic() {
            music.play().then(() => {
                console.log("Playback started");
            }).catch(error => {
                console.log("Playback blocked by browser. Awaiting interaction.");
            });
            
            // Remove listeners once music starts
            document.removeEventListener('click', playMusic);
            document.removeEventListener('keydown', playMusic);
        }

        // These listen for the very first interaction (Click or Key Press)
        document.addEventListener('click', playMusic);
        document.addEventListener('keydown', playMusic);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const loginCard = document.querySelector('.login-card');
            const welcomeOverlay = document.getElementById('welcomeOverlay');

            if(user === "nvcv3000" && pass === "one%family") {
                // 1. Fade out the login form
                loginCard.style.transition = "opacity 1.5s ease, transform 1.5s ease";
                loginCard.style.opacity = "0";
                loginCard.style.transform = "scale(0.9)";

                setTimeout(() => {
                    loginCard.style.display = "none";
                    
                    // 2. Show the Welcome Message
                    welcomeOverlay.style.display = "flex";
                    // Small delay to trigger the CSS transition
                    setTimeout(() => {
                        welcomeOverlay.style.opacity = "1";
                    }, 100);

                    // 3. Fade out Welcome and Redirect
                    setTimeout(() => {
                        welcomeOverlay.style.opacity = "0";
                        setTimeout(() => {
                            window.location.href = "news.html";
                        }, 1500); // Wait for fade out to finish
                    }, 4300); // How long the welcome message stays visible

                }, 1500); // Wait for login card to disappear
                
            } else {
                alert("Invalid Username or Password. Access Denied.");
            }
        });

    </script>  
</body>
</html>
